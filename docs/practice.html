<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice: Make your Postgres agent-ready</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<style>
  :root { --bg: #050706; --panel: #0b0f0c; --line: #1f2722; --fg: #e7ece9; --muted: #8b958f; --green: #5fed83; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(380px, 1fr); grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  header b { font-weight: 600; }
  header .spacer { flex: 1; }
  header .muted { color: var(--muted); }
  button { background: #141a16; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--green); }
  label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #deck-wrap { padding: 16px; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #deck { width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 10px; background: #000; max-height: 100%; }
  #doc { overflow-y: auto; padding: 8px 28px 120px; border-left: 1px solid var(--line); background: var(--panel); }
  #doc h1 { font-size: 22px; }
  #doc h2 { font-size: 19px; margin-top: 32px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #doc h3 { font-size: 16px; margin: 26px 0 6px; color: var(--muted); cursor: pointer; }
  #doc h3:hover { color: var(--fg); }
  #doc .slide-block { border-left: 3px solid transparent; padding-left: 12px; margin-left: -15px; transition: border-color .2s, background .2s; border-radius: 4px; }
  #doc .slide-block.current { border-left-color: var(--green); background: rgba(95, 237, 131, .06); }
  #doc .slide-block.current h3 { color: var(--green); }
  #doc .slide-block p { font-size: 18px; line-height: 1.6; }
  #doc table { border-collapse: collapse; font-size: 14px; }
  #doc td, #doc th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  #doc code { background: #141a16; padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  #doc pre { background: #141a16; padding: 12px; border-radius: 8px; overflow-x: auto; }
  #doc blockquote { color: var(--muted); border-left: 3px solid var(--line); margin-left: 0; padding-left: 12px; }
  #doc a { color: var(--green); }
  #reloaded { color: var(--green); opacity: 0; transition: opacity .3s; }
  #reloaded.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <b>Practice</b>
  <button id="prev" title="Previous slide (←)">←</button>
  <span id="pos" class="muted">1/1</span>
  <button id="next" title="Next slide (→)">→</button>
  <label><input type="checkbox" id="follow" checked> follow the script</label>
  <span id="reloaded">reloaded</span>
  <span class="spacer"></span>
  <span class="muted">Click a script heading to jump · edit talk.md or talk-deck-v3/index.html and this page updates</span>
</header>
<div id="deck-wrap"><iframe id="deck" src="talk-deck-v3/index.html#1" title="Slides"></iframe></div>
<main id="doc"></main>
<script>
  const DECK = 'talk-deck-v3/index.html';
  const DOC = 'talk.md';
  const deck = document.getElementById('deck');
  const doc = document.getElementById('doc');
  const follow = document.getElementById('follow');
  let docText = '';
  let deckText = '';
  let slide = 1;

  async function read(path) {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
    return res.text();
  }

  // Wraps each "### N. Title" section of the script in a block so the current slide can be highlighted.
  function renderDoc() {
    const top = doc.scrollTop;
    doc.innerHTML = marked.parse(docText);
    let block = null;
    for (const el of [...doc.children]) {
      const n = el.tagName === 'H3' && el.textContent.match(/^(\d+)\.\s/);
      if (n) {
        block = document.createElement('section');
        block.className = 'slide-block';
        block.dataset.slide = n[1];
        el.before(block);
        el.addEventListener('click', () => goTo(Number(n[1])));
      } else if (el.tagName === 'H2' || el.tagName === 'H1') {
        block = null;
      }
      if (block) block.append(el);
    }
    doc.scrollTop = top;
    highlight(false);
  }

  function highlight(scroll) {
    let current = null;
    for (const b of doc.querySelectorAll('.slide-block')) {
      const on = Number(b.dataset.slide) === slide;
      b.classList.toggle('current', on);
      if (on && !current) current = b;
    }
    if (scroll && current && follow.checked) current.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function deckSlide() {
    const n = Number(deck.contentWindow?.location.hash.slice(1));
    return Number.isInteger(n) && n > 0 ? n : 1;
  }

  function goTo(n) {
    deck.contentWindow.location.hash = `#${n}`;
  }

  function step(delta) {
    const total = deck.contentDocument?.querySelectorAll('.slide').length ?? 1;
    goTo(Math.min(Math.max(deckSlide() + delta, 1), total));
  }

  function flash() {
    const el = document.getElementById('reloaded');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1200);
  }

  setInterval(() => {
    const n = deckSlide();
    const total = deck.contentDocument?.querySelectorAll('.slide').length ?? 1;
    document.getElementById('pos').textContent = `${n}/${total}`;
    if (n !== slide) { slide = n; highlight(true); }
  }, 250);

  async function poll() {
    try {
      const [d, k] = await Promise.all([read(DOC), read(DECK)]);
      if (d !== docText) { const first = !docText; docText = d; renderDoc(); if (!first) flash(); }
      if (k !== deckText) {
        const first = !deckText;
        deckText = k;
        if (!first) { deck.src = `${DECK}?t=${Date.now()}#${slide}`; flash(); }
      }
    } catch (error) {
      console.error('[practice] reload failed:', error);
    }
  }
  poll();
  setInterval(poll, 1000);

  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); step(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  });
</script>
</body>
</html>
